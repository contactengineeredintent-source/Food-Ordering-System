<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Ordering System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="d-flex">
    <aside class="p-2">
      <div
        id="side_banner_section"
        class="d-flex flex-column align-items-center justify-content-center border-bottom border-secondary"
      >
        <img src="aside_log.png" alt="logo_image" />
        <p class="text-white fs-1 fw-bold">Alpino's</p>
        <p class="text-danger fs-5">Eat fresh, Stay Fit</p>
      </div>
      <div
        id="quick_links_section"
        class="text-white p-3 border-bottom border-secondary"
      >
        <p class="fs-4 text-center fw-bold">Quick Links</p>
        <ol class="fs-4">
          <li>Home</li>
          <li>Your Order</li>
          <li>Wallet</li>
          <li>Profile</li>
          <li>Logout</li>
          <li>Menu</li>
        </ol>
      </div>
      <div id="about_us_section" class="p-3">
        <p class="fs-4 text-center fw-bold text-white">More About Us</p>
        <ol class="fs-4 text-white">
          <li>Our Blog</li>
          <li>Upcoming Dishes</li>
          <li>Our Story</li>
          <li>Social Media Links</li>
        </ol>
      </div>
    </aside>
    <main>
      <div id="navigation_section" class="p-3 d-flex gap-2">
        <input
          id="search_bar"
          type="text"
          placeholder="Search Food Item"
          class="form-control border-0 text-secondary"
        />
        <button class="nav_btn btn btn-danger">Signup</button>
        <button class="nav_btn btn btn-danger">Login</button>
        <img
          id="navigation_section_logo"
          src="aside_log.png"
          alt="logo_image"
        />
      </div>
      <div id="banner_image_section" class="p-3">
        <img id="banner_image" src="home_banner.png" alt="banner_image" />
      </div>
      <p class="fs-4 fw-bold p-3 text-white mb-1">Menu</p>
      <div id="menu_section" class="p-3 text-white gap-3"></div>
    </main>
  </body>

  <script src="script.js"></script>
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"
  ></script>
</html>
